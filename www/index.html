<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>夜雨音乐</title>
    <link href="style/yy_music.css?v=12" rel="stylesheet">
    <style>
    /* 右侧歌词/封面面板：固定宽度，窗口缩放时不再变化 */
    .yyMusic .yyMusicMain > .yyMusicLrc{
        flex:0 0 340px;
        width:340px;
        min-width:340px;
        max-width:340px;
    }
    .yyMusic .yyMusicMain > .yyMusicList{
        flex:1 1 0;
        min-width:0;
    }
    /* 下载按钮列 */
    .yyMusic .music-table th.download-col,
    .yyMusic .music-table td.download-col{
        width:56px;
        max-width:56px;
        text-align:center;
    }
    .yyMusic .downloadBtn{
        cursor:pointer;
        color:#9aa0a6;
        font-size:12px;
        text-decoration:none;
        user-select:none;
        white-space:nowrap;
    }
    .yyMusic .downloadBtn:hover{ color:#fff; }
    .yyMusic .list_item.curr .downloadBtn{ color:#cfcfcf; }
    /* 设置按钮（页头右侧） */
    .yyMusic .yyMusicRight .settingsBtn{
        margin-left:8px;
        padding:2px 10px;
        border:1px solid #3a3a3a;
        border-radius:14px;
        color:#cfcfcf;
        font-size:13px;
        text-decoration:none;
        user-select:none;
        transition:all .15s;
    }
    .yyMusic .yyMusicRight .settingsBtn:hover{
        border-color:#2b6cff;
        color:#fff;
    }

    /* ===== 手机端适配（仅窄屏生效，桌面版不受影响）=====
       注意：除歌词浮层（用 .lrcOpen 明确控制显示）外，
       本段不覆盖 display，否则会盖掉标签切换用的 jQuery .hide()（display:none）。 */
    @media (max-width:820px){
        html, body{ overflow-x:hidden; }

        /* ===== 歌词浮层：点「词」全屏展示，可「返回列表」 =====
           关键：默认 display:none（带 !important），仅 .lrcOpen 时显示，
           保证在任何宽度都能被 JS 正确开合，不再出现「点了变空白」。 */
        .yyMusic .yyMusicMain > .yyMusicLrc{
            display:none !important;
            position:fixed !important; left:0 !important; right:0 !important;
            top:75px !important; bottom:60px !important;
            width:auto !important; min-width:0 !important; max-width:none !important;
            flex:none !important; z-index:90 !important;
            background-color:rgba(0,0,0,.42);
            -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
            overflow:hidden;
        }
        .yyMusic .yyMusicMain > .yyMusicLrc.lrcOpen{ display:block !important; }

        .yyMusic .yyMusicLrc .yy-lrc-back{
            display:flex; align-items:center;
            position:absolute; left:10px; top:8px; z-index:12;
            padding:6px 12px; border-radius:14px;
            background-color:rgba(255,255,255,.15);
            color:#fff; font-size:13px; line-height:1.2;
            text-decoration:none; user-select:none;
        }
        .yyMusic .yyMusicLrc .yy-lrc-back:active{ background-color:rgba(255,255,255,.3); }

        .yyMusic .yyMusicLrc .yyMusicLrc_w{
            display:flex; flex-direction:column;
            height:100% !important; box-sizing:border-box;
            padding:0 6px 4px !important;
        }
        .yyMusic .yyMusicLrc .yyMusicAlbum{
            position:relative !important; top:auto !important; left:auto !important;
            transform:none !important; margin:46px auto 10px !important; flex:none;
        }
        .yyMusic .yyMusicLrc .albumPoster,
        .yyMusic .yyMusicLrc .albumPoster .image{
            width:96px !important; height:96px !important; border-radius:6px;
        }
        /* 桌面版的唱片装饰图是固定 201×180，小封面上会露出来，手机端直接隐藏 */
        .yyMusic .yyMusicLrc .albumPoster:after{ display:none !important; }
        .yyMusic .yyMusicLrc .lrcText{
            flex:1 1 auto !important; height:auto !important; min-height:0 !important;
            padding:0 12px !important;
            overscroll-behavior:contain;
            -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);
            mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);
        }
        .yyMusic .yyMusicLrc .lrcText::-webkit-scrollbar{ width:0 !important; height:0 !important; }
        .yyMusic .yyMusicLrc .lrcText .loadLrc{ padding:14px 0 !important; }
        .yyMusic .yyMusicLrc .lrcText .loadLrc li{ font-size:14px !important; line-height:34px; }
        .yyMusic .yyMusicLrc .lrcText .loadLrc li.currline{ font-size:17px !important; }
        .yyMusic .yyMusicLrc .defaultLrc{ font-size:14px; }

        /* 「词」按钮打开时高亮 */
        .yyMusic .yyMusicView .playbtn>a.songlrc.on{ color:#48baff !important; }

        .yyMusic .yyMusicMain > .yyMusicList{
            flex:1 1 auto !important; width:100% !important;
            min-width:0 !important; max-width:none !important;
        }

        /* --- 工具栏：高度自适应，第二排（搜索框）不再被裁掉 --- */
        .yyMusic .musiclist_top{
            height:auto !important;
            overflow:visible !important;
            white-space:normal !important;
            padding:0 8px !important;
        }
        .yyMusic .musiclist_flex{
            flex-direction:column !important;
            align-items:stretch !important;
            justify-content:flex-start !important;
            overflow-x:visible !important;
            gap:8px !important;
            padding:8px 0 !important;
        }
        /* 第一排：4 个按钮均分整行 */
        .yyMusic .musiclist_flex .list_bar{
            display:flex !important; flex-wrap:nowrap !important;
            width:100% !important; gap:5px !important;
        }
        .yyMusic .musiclist_flex .list_bar > a{
            flex:1 1 0 !important; min-width:0 !important;
            margin:0 !important; padding:8px 1px !important;
            text-align:center !important; font-size:11px !important;
            white-space:nowrap !important;
        }
        .yyMusic .musiclist_flex .list_bar > a > i{
            font-size:11px !important; margin-right:2px !important;
        }
        /* 第二排：搜索框整行占满 */
        .yyMusic .musiclist_flex .flex_r{ width:100% !important; }
        .yyMusic .musiclist_flex .flex_r .searchBtn{
            display:block !important; padding:0 !important; border:0 !important;
        }
        .yyMusic .musiclist_flex .flex_r .searchBtn form{
            display:flex !important; width:100% !important;
            box-sizing:border-box !important;
        }
        .yyMusic .musiclist_flex .flex_r .searchBtn form input{
            flex:1 1 auto !important; min-width:0 !important; width:auto !important;
        }

        /* --- 列表页：放开高度链，整页纵向滚动（不动 display） --- */
        .yyMusic .music-data-list.webTab{
            height:100% !important;
            overflow-y:auto !important; overflow-x:hidden !important;
            -webkit-overflow-scrolling:touch;
        }
        .yyMusic .music-data-list.webTab .music-table-wrap{
            height:auto !important; min-width:0 !important;
            overflow:visible !important;
        }
        .yyMusic .music-data-list.webTab .table-scroll{
            height:auto !important; max-height:none !important;
            overflow:visible !important;
        }

        /* --- 表格：去掉 400px 最小宽度，5 列固定不超屏 --- */
        .yyMusic .music-table-wrap{
            width:100% !important; min-width:0 !important;
            padding:0 6px !important; box-sizing:border-box !important;
        }
        .yyMusic .music-table{ table-layout:fixed !important; width:100% !important; }
        .yyMusic .music-table td, .yyMusic .music-table th{
            padding:10px 4px !important; max-width:none !important;
        }
        /* 序号 */
        .yyMusic .music-table td:first-child, .yyMusic .music-table th:first-child{
            width:32px !important; padding:0 2px !important;
        }
        /* 歌名：自适应剩余宽度 */
        .yyMusic .music-table td:nth-child(2), .yyMusic .music-table th:nth-child(2){
            width:auto !important;
        }
        /* 歌手 */
        .yyMusic .music-table td:nth-child(3), .yyMusic .music-table th:nth-child(3){
            width:30% !important;
        }
        /* 收藏 */
        .yyMusic .music-table td:nth-child(4), .yyMusic .music-table th:nth-child(4){
            width:42px !important; max-width:42px !important; padding:10px 2px !important;
        }
        /* 下载 */
        .yyMusic .music-table td.download-col, .yyMusic .music-table th.download-col{
            width:48px !important; max-width:48px !important; padding:10px 4px !important;
        }

        /* --- 表头并入数据表：避免「表头一张表、数据另一张表」各算列宽导致错位 --- */
        .yyMusic .music-data-list > .music-table.head-only{ display:none !important; }
        .yyMusic .table-scroll .music-table[for] thead{ display:table-header-group !important; }
        .yyMusic .music-table .list_data{ display:table-row-group !important; }
        .yyMusic .music-table.currentList{ display:table !important; }

        /* 长列表滚动时表头吸顶 */
        .yyMusic .table-scroll .music-table[for] thead th{
            position:sticky !important; top:0; z-index:5;
            background-color:rgba(26,19,14,.96);
            -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
        }

        /* 歌单浮层不超出屏幕 */
        .yyMusic .playlist{ width:94vw !important; right:3vw !important; }

        /* layer 弹窗（设置 / 下载询问 / 提示）不超出屏幕 */
        .layui-layer-page{
            left:4vw !important; right:4vw !important;
            margin-left:0 !important; max-width:92vw !important;
            box-sizing:border-box !important;
        }
    }
    </style>
    <script src="jquery.min.js"></script>
    <script src="layer/layer.js"></script>
    <script src="yy_music.js?v=12"></script>
    <script src="style/spectrum.js"></script>
</head>
<body>
    <div class="yy_music"></div>
    <script>
    // 播放器实例化
    var yymusic= new yyMusic({
        elem       : ".yy_music",
        name       : "夜雨音乐",
        autoplay   : true,
        loop       : false,
        volume     : 0.8
    });
    
    // 频谱实例化
    var spectrum = new AudioWave(yymusic, '#spectrumOut');
        spectrum.start();
        spectrum.barWidth = 5;
        spectrum.barGap = 2;
        spectrum.gradient = true; // 是否渐变
        

    /*添加音乐列表*/
    yymusic.PlayData([
        {
            mid: 478507889,
            SongName: "卡农",
            SongUrl: yyFullApi("API/?src=478507889&server=netease"),
            SongPoster: yyFullApi("API/?pic=478507889&server=netease"),
            SongLrc: yyFullApi('API/?lyric=478507889&server=netease'),
        }
    ]);

    /*添加网络列表*/
    yymusic.PlayData(yyFullApi('./API/?playlist=17850444369'));

    /*移动端：未配置服务器地址时自动弹出设置*/
    if (window.yymusic && yymusic._androidSetupCheck) yymusic._androidSetupCheck();
    
    /*监听事件*/
    yymusic.on(function(e){
        /*标题栏实时更新歌词*/
        $('title').text(e.currentLyric);
        
        if(e.state === 'play'){
            spectrum.start();
        }
        if(e.state === 'pause'){
            spectrum.stop();
        }
    });
    </script>
</body>
</html>
