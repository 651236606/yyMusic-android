<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>夜雨音乐</title>
    <link href="style/yy_music.css" rel="stylesheet">
    <style>
    /* 右侧歌词/封面面板：固定宽度，窗口缩放时不再变化 */
    .yyMusic .yyMusicMain > .yyMusicLrc{
        flex:0 0 340px;
        width:340px;
        min-width:340px;
        max-width:340px;
    }
    .yyMusic .yyMusicMain > .yyMusicList{
        flex:1 1 0;
        min-width:0;
    }
    /* 下载按钮列 */
    .yyMusic .music-table th.download-col,
    .yyMusic .music-table td.download-col{
        width:56px;
        max-width:56px;
        text-align:center;
    }
    .yyMusic .downloadBtn{
        cursor:pointer;
        color:#9aa0a6;
        font-size:12px;
        text-decoration:none;
        user-select:none;
        white-space:nowrap;
    }
    .yyMusic .downloadBtn:hover{ color:#fff; }
    .yyMusic .list_item.curr .downloadBtn{ color:#cfcfcf; }
    /* 设置按钮（页头右侧） */
    .yyMusic .yyMusicRight .settingsBtn{
        margin-left:8px;
        padding:2px 10px;
        border:1px solid #3a3a3a;
        border-radius:14px;
        color:#cfcfcf;
        font-size:13px;
        text-decoration:none;
        user-select:none;
        transition:all .15s;
    }
    .yyMusic .yyMusicRight .settingsBtn:hover{
        border-color:#2b6cff;
        color:#fff;
    }
    </style>
    <script src="jquery.min.js"></script>
    <script src="layer/layer.js"></script>
    <script src="yy_music.js?v=6"></script>
    <script src="style/spectrum.js"></script>
</head>
<body>
    <div class="yy_music"></div>
    <script>
    // 播放器实例化
    var yymusic= new yyMusic({
        elem       : ".yy_music",
        name       : "夜雨音乐",
        autoplay   : true,
        loop       : false,
        volume     : 0.8
    });
    
    // 频谱实例化
    var spectrum = new AudioWave(yymusic, '#spectrumOut');
        spectrum.start();
        spectrum.barWidth = 5;
        spectrum.barGap = 2;
        spectrum.gradient = true; // 是否渐变
        

    /*添加音乐列表*/
    yymusic.PlayData([
        {
            mid: 478507889,
            SongName: "卡农",
            SongUrl: yyFullApi("API/?src=478507889&server=netease"),
            SongPoster: yyFullApi("API/?pic=478507889&server=netease"),
            SongLrc: yyFullApi('API/?lyric=478507889&server=netease'),
        }
    ]);

    /*添加网络列表*/
    yymusic.PlayData(yyFullApi('./API/?playlist=17850444369'));

    /*移动端：未配置服务器地址时自动弹出设置*/
    if (window.yymusic && yymusic._androidSetupCheck) yymusic._androidSetupCheck();
    
    /*监听事件*/
    yymusic.on(function(e){
        /*标题栏实时更新歌词*/
        $('title').text(e.currentLyric);
        
        if(e.state === 'play'){
            spectrum.start();
        }
        if(e.state === 'pause'){
            spectrum.stop();
        }
    });
    </script>
</body>
</html>
