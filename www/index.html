<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>夜雨音乐</title>
    <link href="style/yy_music.css" rel="stylesheet">
    <style>
    /* 右侧歌词/封面面板：固定宽度，窗口缩放时不再变化 */
    .yyMusic .yyMusicMain > .yyMusicLrc{
        flex:0 0 340px;
        width:340px;
        min-width:340px;
        max-width:340px;
    }
    .yyMusic .yyMusicMain > .yyMusicList{
        flex:1 1 0;
        min-width:0;
    }
    /* 下载按钮列 */
    .yyMusic .music-table th.download-col,
    .yyMusic .music-table td.download-col{
        width:56px;
        max-width:56px;
        text-align:center;
    }
    .yyMusic .downloadBtn{
        cursor:pointer;
        color:#9aa0a6;
        font-size:12px;
        text-decoration:none;
        user-select:none;
        white-space:nowrap;
    }
    .yyMusic .downloadBtn:hover{ color:#fff; }
    .yyMusic .list_item.curr .downloadBtn{ color:#cfcfcf; }
    /* 设置按钮（页头右侧） */
    .yyMusic .yyMusicRight .settingsBtn{
        margin-left:8px;
        padding:2px 10px;
        border:1px solid #3a3a3a;
        border-radius:14px;
        color:#cfcfcf;
        font-size:13px;
        text-decoration:none;
        user-select:none;
        transition:all .15s;
    }
    .yyMusic .yyMusicRight .settingsBtn:hover{
        border-color:#2b6cff;
        color:#fff;
    }

    /* ================= 手机端适配（窄屏，桌面版不受影响） ================= */
    @media (max-width:820px){
        html, body{ width:100% !important; max-width:100% !important; overflow-x:hidden !important; }

        /* ---- 顶栏：缩小字号，节省横向空间 ---- */
        .yyMusic .yyMusicHeader{ height:56px !important; padding:0 12px !important; }
        .yyMusic .yyMusicHeader .yyMusicTitle{ font-size:18px !important; }
        .yyMusic .yyMusicHeader .yyMusicRight a{ padding:8px 5px !important; font-size:13px !important; }
        .yyMusic .yyMusicHeader .yyMusicRight .settingsBtn{
            margin-left:6px !important; padding:2px 8px !important; font-size:12px !important;
        }
        .yyMusic .yyMusicMain{
            width:100% !important; padding-top:56px !important; padding-bottom:58px !important;
        }

        /* ---- 隐藏右侧封面/歌词面板，让列表占满整屏 ---- */
        .yyMusic .yyMusicMain > .yyMusicLrc{ display:none !important; }

        /* ---- 宽度链全部放开，消除任何固定的最小宽度 ---- */
        .yyMusic .yyMusicMain > .yyMusicList,
        .yyMusic .music-table-wrap,
        .yyMusic .music-data-list,
        .yyMusic .table-scroll{
            width:100% !important; max-width:100% !important; min-width:0 !important;
        }
        .yyMusic .music-table-wrap{ min-width:0 !important; }

        /* ---- 列表区改为纵向 flex：工具栏在上，表格自动占满剩余高度 ----
           注意：display 只在「当前激活页」上强制为 flex（.yy-tab-on），
           否则 !important 会覆盖切换时的 display:none，导致点歌单没反应 */
        .yyMusic .music-data-list.webTab{
            height:100% !important; overflow:hidden !important;
        }
        .yyMusic .music-data-list.webTab.yy-tab-on{
            display:flex !important; flex-direction:column !important;
        }
        .yyMusic .music-list-top, .yyMusic .musiclist_top{
            flex:0 0 auto !important; height:auto !important;
            padding:0 8px !important; overflow:visible !important; white-space:normal !important;
        }
        .yyMusic .music-data-list.webTab > table.music-table{ flex:0 0 auto !important; }
        /* 只作用于歌曲列表的滚动区，别影响歌单弹层里的 .table-scroll */
        .yyMusic .music-data-list .table-scroll{
            flex:1 1 auto !important; height:auto !important; min-height:0 !important;
            overflow-y:auto !important; overflow-x:hidden !important;
            -webkit-overflow-scrolling:touch;
        }

        /* ---- 工具栏：第一排 4 个按钮均分，第二排搜索框全宽 ---- */
        .yyMusic .musiclist_flex{
            display:flex !important; flex-direction:column !important;
            align-items:stretch !important; justify-content:flex-start !important;
            gap:6px !important; padding:6px 0 4px !important;
            overflow:visible !important; width:100% !important;
        }
        .yyMusic .musiclist_flex .list_bar{
            display:flex !important; flex-wrap:nowrap !important;
            width:100% !important; gap:4px !important;
        }
        .yyMusic .musiclist_flex .list_bar > a{
            flex:1 1 0 !important; min-width:0 !important; margin:0 !important;
            padding:7px 2px !important; font-size:11px !important; line-height:1.1 !important;
            text-align:center !important; white-space:nowrap !important;
            overflow:hidden !important; text-overflow:ellipsis !important;
        }
        .yyMusic .musiclist_flex .list_bar > a > i{
            font-size:11px !important; margin-right:2px !important;
        }
        .yyMusic .musiclist_flex a + a{ margin-left:0 !important; }
        .yyMusic .musiclist_flex .flex_r{ display:block !important; width:100% !important; margin:0 !important; }
        .yyMusic .musiclist_flex .flex_r .searchBtn{
            display:block !important; width:100% !important; padding:0 !important;
            border:1px solid rgb(255 255 255/15%) !important; border-radius:5px !important;
        }
        .yyMusic .musiclist_flex .flex_r .searchBtn form{
            display:flex !important; width:100% !important;
            box-sizing:border-box !important; padding:5px 10px !important;
        }
        .yyMusic .musiclist_flex .flex_r .searchBtn form input{
            flex:1 1 auto !important; width:auto !important; min-width:0 !important;
        }

        /* ---- 表格：固定列宽，总宽严格不超过屏幕，最后一列不再被挤出 ---- */
        .yyMusic .music-table{ table-layout:fixed !important; width:100% !important; }
        .yyMusic .music-table td, .yyMusic .music-table th{ padding:9px 5px !important; }
        .yyMusic .music-table td:first-child, .yyMusic .music-table th:first-child{
            width:32px !important; padding:0 2px 0 8px !important;
        }
        .yyMusic .music-table td:nth-child(2), .yyMusic .music-table th:nth-child(2){
            width:auto !important; padding-left:4px !important;
        }
        .yyMusic .music-table td:nth-child(3), .yyMusic .music-table th:nth-child(3){
            width:30% !important;
        }
        .yyMusic .music-table td:nth-child(4), .yyMusic .music-table th:nth-child(4){
            width:42px !important; padding:9px 0 !important;
        }
        .yyMusic .music-table td.download-col, .yyMusic .music-table th.download-col{
            width:48px !important; max-width:48px !important; padding:9px 8px 9px 0 !important;
        }
        .yyMusic .music-table td:nth-child(2), .yyMusic .music-table td:nth-child(3){
            white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important;
        }
        .yyMusic .curr td:first-child{ background-position:2px center !important; }

        /* ---- 歌单弹层也别超出屏幕 ---- */
        .yyMusic .playlist{ width:94vw !important; right:3vw !important; }

        /* ---- layer 弹窗（设置/下载询问等）不超过屏幕 ---- */
        .layui-layer{ max-width:calc(100vw - 20px) !important; box-sizing:border-box !important; }
        .layui-layer-content{ overflow-x:hidden !important; }
        .yeyu-settings{ min-width:0 !important; }
    }
    </style>
    <script src="jquery.min.js"></script>
    <script src="layer/layer.js"></script>
    <script src="yy_music.js?v=9"></script>
    <script src="style/spectrum.js"></script>
</head>
<body>
    <div class="yy_music"></div>
    <script>
    // 播放器实例化
    var yymusic= new yyMusic({
        elem       : ".yy_music",
        name       : "夜雨音乐",
        autoplay   : true,
        loop       : false,
        volume     : 0.8
    });
    
    // 频谱实例化
    var spectrum = new AudioWave(yymusic, '#spectrumOut');
        spectrum.start();
        spectrum.barWidth = 5;
        spectrum.barGap = 2;
        spectrum.gradient = true; // 是否渐变
        

    /*添加音乐列表*/
    yymusic.PlayData([
        {
            mid: 478507889,
            SongName: "卡农",
            SongUrl: yyFullApi("API/?src=478507889&server=netease"),
            SongPoster: yyFullApi("API/?pic=478507889&server=netease"),
            SongLrc: yyFullApi('API/?lyric=478507889&server=netease'),
        }
    ]);

    /*添加网络列表*/
    yymusic.PlayData(yyFullApi('./API/?playlist=17850444369'));

    /*移动端：未配置服务器地址时自动弹出设置*/
    if (window.yymusic && yymusic._androidSetupCheck) yymusic._androidSetupCheck();
    
    /*监听事件*/
    yymusic.on(function(e){
        /*标题栏实时更新歌词*/
        $('title').text(e.currentLyric);
        
        if(e.state === 'play'){
            spectrum.start();
        }
        if(e.state === 'pause'){
            spectrum.stop();
        }
    });
    </script>
</body>
</html>
