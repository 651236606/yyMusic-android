name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install npm dependencies
        run: npm install

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Detect signing secrets
        id: sign
        run: |
          if [ -n "$KS_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "detected keystore: will also build signed release APK"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no keystore secret: debug APK only"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yeyu-music-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: steps.sign.outputs.enabled == 'true'
        run: echo "$KS_B64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: steps.sign.outputs.enabled == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yeyu-music-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
